on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Run CodeSniffer in Docker
    - name: Generate CodeSniffer Report
      continue-on-error: true
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/var/www/html/src/app/code/Auctane \
          markoshust/magento-php:8.3-fpm-2 \
          bash -c "
            mkdir -p /tmp/phpcs-setup &&
            cd /tmp/phpcs-setup &&
            composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true &&
            composer require --dev magento/magento-coding-standard &&
            vendor/bin/phpcs --standard=Magento2 --report=checkstyle --report-file=/var/www/html/src/app/code/Auctane/Api/phpcs-report.xml --ignore=*/vendor/*,*/Test/* /var/www/html/src/app/code/Auctane/Api || true
          "

    # Step 3: Install cs2pr for annotations
    - name: Install cs2pr
      if: always()
      run: |
        curl -L https://github.com/staabm/annotate-pull-request-from-checkstyle/releases/latest/download/cs2pr -o cs2pr
        chmod +x cs2pr
        sudo mv cs2pr /usr/local/bin/

    # Step 4: Annotate PR with violations
    - name: Annotate Code Issues
      if: always()
      run: |
        if [ -f Api/phpcs-report.xml ]; then
          cat Api/phpcs-report.xml | cs2pr --graceful-warnings
        fi

    # Step 5: Generate and post summary comment
    - name: Post PR Comment with Summary
      if: always() && github.event_name == 'pull_request'
      run: |
        if [ -f Api/phpcs-report.xml ]; then
          # Count violations
          TOTAL_FILES=$(grep -o '<file name=' Api/phpcs-report.xml | wc -l)
          TOTAL_ERRORS=$(grep -o 'severity="error"' Api/phpcs-report.xml | wc -l)
          TOTAL_WARNINGS=$(grep -o 'severity="warning"' Api/phpcs-report.xml | wc -l)

          # Create markdown comment
          cat > comment.md << 'EOF'
        ## 📋 Code Quality Report

        ### Summary
        - **Files Checked:** $TOTAL_FILES
        - **Errors:** $TOTAL_ERRORS
        - **Warnings:** $TOTAL_WARNINGS

        EOF

          # Replace variables
          sed -i "s/\$TOTAL_FILES/$TOTAL_FILES/g" comment.md
          sed -i "s/\$TOTAL_ERRORS/$TOTAL_ERRORS/g" comment.md
          sed -i "s/\$TOTAL_WARNINGS/$TOTAL_WARNINGS/g" comment.md

          if [ "$TOTAL_ERRORS" -eq 0 ] && [ "$TOTAL_WARNINGS" -eq 0 ]; then
            echo "✅ **No issues found!** Great job!" >> comment.md
          else
            echo "### 📝 Details" >> comment.md
            echo "" >> comment.md
            echo "Check the **Files Changed** tab to see inline annotations for each issue." >> comment.md
          fi

          echo "" >> comment.md
          echo "_Generated by Magento 2 Coding Standards check_" >> comment.md

          # Post comment using gh CLI
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}