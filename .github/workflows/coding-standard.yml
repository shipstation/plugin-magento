on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Run CodeSniffer in Docker
    - name: Generate CodeSniffer Report
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/var/www/html/src/app/code/Auctane \
          markoshust/magento-php:8.3-fpm-2 \
          bash -c "
            cd /var/www/html/src/app/code/Auctane &&
            composer require --dev magento/magento-coding-standard &&
            composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true &&
            composer install &&
            vendor/bin/phpcs --standard=Magento2 --runtime-set ignore_warnings_on_exit 1 /var/www/html/src/app/code/Auctane
          "